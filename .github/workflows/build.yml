name: Maker Arcade Android Build

on:
  push:
    branches: ["main", "feat/maker-arcade-offline-mvp"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Run lab calculation tests
        run: npm test

      - name: Check JavaScript syntax and required app files
        run: |
          node --check www/js/app.js
          test -s www/index.html
          test -s www/css/index.css
          grep -q "Maker Arcade" www/index.html
          grep -q "js/app.js" www/index.html
          grep -q "connect-src 'none'" www/index.html

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare Cordova Android assets
        run: npx cordova prepare android

      - name: Build debug APK
        run: |
          cd platforms/android
          chmod +x tools/gradlew
          ./tools/gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: maker-arcade-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
